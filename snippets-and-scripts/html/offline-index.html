<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <style>
      :root {
        --sans-serif: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --serif: Georgia, 'Times New Roman', Times, serif;
        --extralight: 200;
        --light: 300;
        --medium: 500;
        --semibold: 600;
        --extrabold: 800;
        --heavy: 900;
        --color-black: #0a0a0a;
        --color-heading: #f31776;
        --color-white: #fefefe;
      }
      * { margin: 0; padding: 0; }
      html, body { background: var(--color-white); color: var(--color-black); font-family: 'Open Sans', var(--sans-serif); font-size: 100%; line-height: normal; }

      h1 { color: var(--color-heading); font-family: 'PT Sans Narrow', var(--sans-serif); font-size: 2rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1rem; }

      main { align-items: center; display: flex; flex-direction: column; height: 100vh; justify-content: center; text-align: center; width: 100vw; }
      main > * { flex: 0 1 auto; }
    </style>
  </head>
  <body>
    <main role="main">
      <h1>Site Name</h1>
      <p>This site is no longer available.</p>
    </main>
  </body>
</html>
